name: terraform

on:
  pull_request:
    paths: ["envs/**", "modules/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["envs/**", "modules/**", ".github/workflows/**"]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_SA_DEV }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -input=false -no-color -out=tfplan
      - name: Post plan på PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; terraform show -no-color tfplan | tail -c 60000; echo '```'; } > plan.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file plan.md

  apply-dev:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_SA_DEV }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve

  apply-prod:
    needs: apply-dev
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: envs/prod
    steps:
      - uses: actions/checkout@v4
      - name: Vis OIDC-claims (debug)
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            core.info(`sub=${claims.sub}`);
            core.info(`repository=${claims.repository}`);
            core.info(`environment=${claims.environment}`);
            core.info(`ref=${claims.ref}`);
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_SA_PROD }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve